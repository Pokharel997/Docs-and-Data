[package]
name = "data-docs"
version = "1.0.0"
description = "Data & Docs desktop app (Linux / Windows)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
encoding_rs = "0.8"
base64 = "0.22"
trash = "5"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
